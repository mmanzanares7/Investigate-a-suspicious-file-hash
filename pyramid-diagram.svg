<text x="60" y="214.0" class="diff">rebuild their tooling</text>
<polygon points="526.6666666666666,246 713.3333333333334,246 760.0,324 480.0,324" fill="#F7EEDC" stroke="#9C5A1B" stroke-width="2"/>
