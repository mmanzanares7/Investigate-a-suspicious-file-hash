<svg viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg">
<style>.lvl-label{font:600 15px sans-serif;fill:#1C2B39;} .ioc-label{font:12.5px sans-serif;fill:#23313C;} .diff{font:italic 11.5px sans-serif;fill:#62727C;} .title{font:600 20px sans-serif;fill:#1C2B39;} .hdr{font:700 12.5px sans-serif;}</style>
<rect x="0" y="0" width="1300" height="700" fill="#F6F7F5"/>
<text x="650" y="34" text-anchor="middle" class="title">Pyramid of Pain: Flagpro Malware IoCs</text>
