<text x="60" y="448.0" class="diff">rotate to a new IP</text>
<polygon points="386.66666666666663,480 853.3333333333334,480 900.0,558 340.0,558" fill="#DCEFE9" stroke="#2E7D6B" stroke-width="2"/>
<text x="620" y="524.0" text-anchor="middle" class="lvl-label">Hash Values</text>
<text x="900" y="511.0" class="ioc-label">MD5: 287d612e29b71c90aa5</text>
<text x="900" y="528.0" class="ioc-label">4947313810a25</text>
<text x="60" y="511.0" class="diff">Trivial — attacker can</text>
<text x="60" y="526.0" class="diff">alter the file in seconds</text>
