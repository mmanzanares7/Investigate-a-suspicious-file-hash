<text x="900" y="277.0" class="ioc-label">HTTP requests made to</text>
<text x="900" y="294.0" class="ioc-label">attacker infrastructure</text>
<text x="60" y="277.0" class="diff">Moderate — attacker must</text>
<text x="60" y="292.0" class="diff">change infrastructure</text>
<polygon points="480.0,324 760.0,324 806.6666666666666,402 433.33333333333337,402" fill="#F7F3DC" stroke="#8C7A1B" stroke-width="2"/>
